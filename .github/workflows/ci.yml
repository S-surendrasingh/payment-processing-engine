name: Verify payment engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: payment_demo
          POSTGRES_PASSWORD: payment_demo
          POSTGRES_DB: payment_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payment_demo -d payment_engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://payment_demo:payment_demo@localhost:5432/payment_engine_test
      TEST_DATABASE_URL: postgresql://payment_demo:payment_demo@localhost:5432/payment_engine_test
      WEBHOOK_SECRET: ci-only-webhook-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:db:prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
